[tools]
go = "1.27"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[tasks."pre-commit"]
description = "Run all pre-commit checks"
run = [
    "mise run test",
    "mise run lint",
    "mise run security",
]

[tasks."test"]
description = "Run unit tests"
run = "go test ./... -v -short"

[tasks."lint"]
run = "golangci-lint run"

[tasks."security"]
run = "govulncheck ./..."
