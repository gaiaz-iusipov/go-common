[tools]
go = "1.27"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[tasks."check"]
depends = ["test", "lint", "security"]

[tasks."test"]
description = "Run unit tests"
run = "go test ./... -v -short"

[tasks."lint"]
run = "golangci-lint run"

[tasks."security"]
run = "govulncheck ./..."
